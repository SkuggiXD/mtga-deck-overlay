name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install -U pip pyinstaller pillow

      - name: Build exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "MTGA Deck Overlay"
          --icon icon.ico
          --paths .
          --hidden-import core
          --hidden-import mtga_features
          --hidden-import ui
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          overlay.py

      - name: Fail if local modules were not collected
        shell: pwsh
        run: |
          $warn = Get-ChildItem -Recurse -Filter "warn-*.txt" | Select-Object -First 1
          if ($warn) { Get-Content $warn.FullName }
          $pyz = Get-ChildItem -Recurse -Filter "PYZ-00.toc" | Select-Object -First 1
          if (-not $pyz) { throw "PYZ toc missing" }
          $toc = Get-Content $pyz.FullName -Raw
          foreach ($mod in @("'core'", "'mtga_features'", "'ui'")) {
            if ($toc -notmatch [regex]::Escape($mod)) {
              throw "PyInstaller did not collect $mod"
            }
          }
          Write-Host "Collected core, mtga_features, and ui"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTGA-Deck-Overlay-Windows
          path: dist/MTGA Deck Overlay.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTGA Deck Overlay.exe
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            Download **MTGA Deck Overlay.exe** below.
            Windows may warn on the first run (unsigned app) — More info → Run anyway.

            In Arena: Options → Account → enable Detailed Logs, then restart.
